<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0" />
      <stop offset="30%" stop-color="#E8C87A" />
      <stop offset="65%" stop-color="#D4A853" />
      <stop offset="100%" stop-color="#9C7320" />
    </linearGradient>

    <filter id="crestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#5C3D5E" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#crestGlow)" stroke="url(#crestGold)" fill="none">
    <!-- Central Royal Arch Medallion -->
    <path d="M 150 25 C 130 25, 110 40, 110 65 C 110 90, 130 110, 150 125 C 170 110, 190 90, 190 65 C 190 40, 170 25, 150 25 Z" stroke-width="1.8" fill="url(#crestGold)" fill-opacity="0.08" />
    <path d="M 150 35 C 138 35, 122 46, 122 65 C 122 84, 138 98, 150 110 C 162 98, 178 84, 178 65 C 178 46, 162 35, 150 35 Z" stroke-width="1.2" stroke-dasharray="2 1.5" />
    
    <!-- Central Crown & Fleur Blossom -->
    <path d="M 150 15 L 150 28 M 145 22 L 155 22" stroke-width="1.5" />
    <circle cx="150" cy="12" r="2.5" fill="#D4A853" />
    <circle cx="150" cy="65" r="4.5" fill="url(#crestGold)" fill-opacity="0.25" stroke-width="1.2" />
    <circle cx="150" cy="65" r="2" fill="#D4A853" />

    <!-- Left Floral Wing Tendrils -->
    <path d="M 115 50 C 95 30, 65 35, 50 55 C 38 72, 48 95, 70 95 C 90 95, 105 80, 115 70" stroke-width="1.6" fill="url(#crestGold)" fill-opacity="0.06" />
    <path d="M 50 55 C 35 45, 20 52, 15 65 C 10 78, 22 90, 38 85" stroke-width="1.3" />
    <circle cx="15" cy="65" r="2" fill="#D4A853" />
    <circle cx="50" cy="55" r="2.5" fill="#D4A853" />
    <circle cx="70" cy="95" r="2" fill="#D4A853" />

    <!-- Right Floral Wing Tendrils -->
    <path d="M 185 50 C 205 30, 235 35, 250 55 C 262 72, 252 95, 230 95 C 210 95, 195 80, 185 70" stroke-width="1.6" fill="url(#crestGold)" fill-opacity="0.06" />
    <path d="M 250 55 C 265 45, 280 52, 285 65 C 290 78, 278 90, 262 85" stroke-width="1.3" />
    <circle cx="285" cy="65" r="2" fill="#D4A853" />
    <circle cx="250" cy="55" r="2.5" fill="#D4A853" />
    <circle cx="230" cy="95" r="2" fill="#D4A853" />

    <!-- Scalloped Lace Arch Beneath Center -->
    <path d="M 100 80 Q 125 105, 150 135 Q 175 105, 200 80" stroke-width="1.4" stroke-dasharray="3 2" />
    <circle cx="100" cy="80" r="2" fill="#D4A853" />
    <circle cx="200" cy="80" r="2" fill="#D4A853" />
    <circle cx="150" cy="135" r="2.5" fill="#D4A853" />
  </g>
</svg>
