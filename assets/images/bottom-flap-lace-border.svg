<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" preserveAspectRatio="none">
  <defs>
    <linearGradient id="botGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C87A" />
      <stop offset="30%" stop-color="#F5DB9A" />
      <stop offset="60%" stop-color="#D4A853" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="botGoldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#5C3D5E" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#botGoldShadow)">
    <!-- Bottom Edge Seam Stitching -->
    <line x1="0" y1="498" x2="1000" y2="498" stroke="url(#botGoldGrad)" stroke-width="2.5" vector-effect="non-scaling-stroke" />
    <line x1="0" y1="494" x2="1000" y2="494" stroke="#FFF0D0" stroke-width="1.2" stroke-dasharray="4 2.5" vector-effect="non-scaling-stroke" />

    <!-- Outer Golden Piping Border (Left & Right Diagonals meeting at top 500,0) -->
    <polyline points="0,500 500,0 1000,500" fill="none" stroke="url(#botGoldGrad)" stroke-width="3" vector-effect="non-scaling-stroke" />

    <!-- Inner Running Gold Embroidery Stitch (Offset 8px) -->
    <polyline points="16,500 500,18 984,500" fill="none" stroke="#FFF2D6" stroke-width="1.5" stroke-dasharray="6 3" vector-effect="non-scaling-stroke" />

    <!-- Secondary Picot Pearl Stitch (Offset 16px) -->
    <polyline points="32,500 500,34 968,500" fill="none" stroke="url(#botGoldGrad)" stroke-width="1.2" stroke-dasharray="2 3.5" vector-effect="non-scaling-stroke" />
  </g>
</svg>
