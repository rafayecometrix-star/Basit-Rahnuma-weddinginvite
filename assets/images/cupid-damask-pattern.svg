<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <g fill="none" stroke="#A8385C" stroke-width="1.2" opacity="0.10">
    <!-- Center Baroque Medallion -->
    <ellipse cx="160" cy="160" rx="48" ry="58" stroke-dasharray="4,4" />
    <ellipse cx="160" cy="160" rx="42" ry="52" stroke="#C59B3F" />
    
    <!-- Cupid / Cherub Silhouette Left (facing center with bow and floral garland) -->
    <g transform="translate(100, 130) scale(0.65)">
      <!-- Head and Curls -->
      <circle cx="20" cy="15" r="9" />
      <path d="M 14 10 Q 18 4 25 7 Q 28 12 24 18" />
      <!-- Wing -->
      <path d="M 12 18 C -2 8, -6 25, 4 32 C -4 34, 0 45, 12 36 Z" fill="rgba(212,122,148,0.08)" />
      <!-- Torso & Arms holding garland -->
      <path d="M 20 24 C 18 36, 15 48, 22 55 C 26 50, 28 38, 26 26 Z" />
      <path d="M 22 26 Q 32 30 42 22" />
      <path d="M 20 30 Q 30 38 40 32" />
      <!-- Legs -->
      <path d="M 18 52 Q 12 65 16 75 Q 22 72 22 60" />
      <path d="M 23 54 Q 28 66 32 74 Q 36 68 28 58" />
      <!-- Heart/Bow in hands -->
      <path d="M 42 22 C 38 18, 38 12, 44 14 C 50 12, 50 18, 46 22 Z" fill="rgba(197,155,63,0.18)" stroke="#C59B3F" />
    </g>

    <!-- Cupid / Cherub Silhouette Right (mirror holding laurel garland) -->
    <g transform="translate(220, 130) scale(-0.65, 0.65)">
      <!-- Head and Curls -->
      <circle cx="20" cy="15" r="9" />
      <path d="M 14 10 Q 18 4 25 7 Q 28 12 24 18" />
      <!-- Wing -->
      <path d="M 12 18 C -2 8, -6 25, 4 32 C -4 34, 0 45, 12 36 Z" fill="rgba(212,122,148,0.08)" />
      <!-- Torso & Arms -->
      <path d="M 20 24 C 18 36, 15 48, 22 55 C 26 50, 28 38, 26 26 Z" />
      <path d="M 22 26 Q 32 30 42 22" />
      <path d="M 20 30 Q 30 38 40 32" />
      <!-- Legs -->
      <path d="M 18 52 Q 12 65 16 75 Q 22 72 22 60" />
      <path d="M 23 54 Q 28 66 32 74 Q 36 68 28 58" />
      <!-- Heart/Bow -->
      <path d="M 42 22 C 38 18, 38 12, 44 14 C 50 12, 50 18, 46 22 Z" fill="rgba(197,155,63,0.18)" stroke="#C59B3F" />
    </g>

    <!-- Rococo Filigree Scrolls Top & Bottom -->
    <path d="M 130 95 C 145 75, 175 75, 190 95 C 180 90, 140 90, 130 95 Z" fill="rgba(197,155,63,0.12)" stroke="#C59B3F" />
    <path d="M 130 225 C 145 245, 175 245, 190 225 C 180 230, 140 230, 130 225 Z" fill="rgba(197,155,63,0.12)" stroke="#C59B3F" />

    <!-- Corner Baroque Flourishes (Tile seamlessly at 0, 320) -->
    <!-- Top-Left -->
    <path d="M 0 40 Q 30 40 40 0" />
    <path d="M 0 30 C 20 30, 30 20, 30 0" stroke-dasharray="3,3" />
    <circle cx="25" cy="25" r="4" stroke="#C59B3F" />
    
    <!-- Top-Right -->
    <path d="M 320 40 Q 290 40 280 0" />
    <path d="M 320 30 C 300 30, 290 20, 290 0" stroke-dasharray="3,3" />
    <circle cx="295" cy="25" r="4" stroke="#C59B3F" />

    <!-- Bottom-Left -->
    <path d="M 0 280 Q 30 280 40 320" />
    <circle cx="25" cy="295" r="4" stroke="#C59B3F" />

    <!-- Bottom-Right -->
    <path d="M 320 280 Q 290 280 280 320" />
    <circle cx="295" cy="295" r="4" stroke="#C59B3F" />

    <!-- Delicate Vine Trellis accents -->
    <path d="M 160 20 Q 150 45 160 70 Q 170 45 160 20" stroke="#C59B3F" stroke-width="0.8" />
    <path d="M 160 250 Q 150 275 160 300 Q 170 275 160 250" stroke="#C59B3F" stroke-width="0.8" />
  </g>
</svg>
