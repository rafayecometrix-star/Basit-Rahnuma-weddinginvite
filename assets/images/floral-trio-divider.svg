<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="100%" height="45" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gold Foil Gradients -->
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="30%" stop-color="#F3E5AB" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#DFB76C" stop-opacity="1" />
      <stop offset="70%" stop-color="#C59B27" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#DFB76C" />
      <stop offset="100%" stop-color="#9E782F" />
    </linearGradient>

    <!-- Blush Rose Gradients -->
    <radialGradient id="roseCenter" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="35%" stop-color="#FBCED9" />
      <stop offset="70%" stop-color="#E28FA8" />
      <stop offset="100%" stop-color="#B85D75" />
    </radialGradient>
    <radialGradient id="roseSide" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="40%" stop-color="#FCD5DF" />
      <stop offset="75%" stop-color="#E69BB1" />
      <stop offset="100%" stop-color="#C26A82" />
    </radialGradient>

    <!-- Soft Rosebud Gradients -->
    <linearGradient id="petalShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D97A94" stop-opacity="0.85" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Central Horizontal Tapered Filigree Lines -->
    <path d="M 20 30 L 140 30" stroke="url(#goldStem)" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 260 30 L 380 30" stroke="url(#goldStem)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Left Tendril & Foliage -->
    <g id="left-tendril">
      <path d="M 160 30 C 135 24, 110 36, 85 28 C 70 23, 55 33, 40 30" fill="none" stroke="url(#goldLeaf)" stroke-width="1.4" stroke-linecap="round" />
      <path d="M 130 28 C 115 16, 95 18, 80 20" fill="none" stroke="url(#goldLeaf)" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 1" />
      
      <path d="M 135 27 C 130 18, 118 18, 122 26 C 126 30, 133 30, 135 27 Z" fill="url(#goldLeaf)" opacity="0.9" />
      <path d="M 105 32 C 100 40, 88 38, 93 31 C 97 27, 103 28, 105 32 Z" fill="url(#goldLeaf)" opacity="0.85" />
      <path d="M 75 26 C 70 18, 60 20, 64 27 C 68 30, 73 29, 75 26 Z" fill="url(#goldLeaf)" opacity="0.75" />
      <path d="M 152 23 C 146 15, 138 17, 142 24 C 145 28, 150 27, 152 23 Z" fill="url(#goldLeaf)" opacity="0.8" />
      
      <circle cx="120" cy="16" r="1.8" fill="#FBF0B9" />
      <circle cx="95" cy="40" r="1.5" fill="#FBF0B9" />
      <circle cx="60" cy="20" r="1.4" fill="#FBF0B9" />
      
      <path d="M 70 12 Q 70 15 67 15 Q 70 15 70 18 Q 70 15 73 15 Q 70 15 70 12 Z" fill="#D4AF37" opacity="0.85" />
    </g>

    <!-- Right Tendril & Foliage (Mirrored) -->
    <g id="right-tendril" transform="translate(400, 0) scale(-1, 1)">
      <path d="M 160 30 C 135 24, 110 36, 85 28 C 70 23, 55 33, 40 30" fill="none" stroke="url(#goldLeaf)" stroke-width="1.4" stroke-linecap="round" />
      <path d="M 130 28 C 115 16, 95 18, 80 20" fill="none" stroke="url(#goldLeaf)" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 1" />
      
      <path d="M 135 27 C 130 18, 118 18, 122 26 C 126 30, 133 30, 135 27 Z" fill="url(#goldLeaf)" opacity="0.9" />
      <path d="M 105 32 C 100 40, 88 38, 93 31 C 97 27, 103 28, 105 32 Z" fill="url(#goldLeaf)" opacity="0.85" />
      <path d="M 75 26 C 70 18, 60 20, 64 27 C 68 30, 73 29, 75 26 Z" fill="url(#goldLeaf)" opacity="0.75" />
      <path d="M 152 23 C 146 15, 138 17, 142 24 C 145 28, 150 27, 152 23 Z" fill="url(#goldLeaf)" opacity="0.8" />
      
      <circle cx="120" cy="16" r="1.8" fill="#FBF0B9" />
      <circle cx="95" cy="40" r="1.5" fill="#FBF0B9" />
      <circle cx="60" cy="20" r="1.4" fill="#FBF0B9" />
      
      <path d="M 70 12 Q 70 15 67 15 Q 70 15 70 18 Q 70 15 73 15 Q 70 15 70 12 Z" fill="#D4AF37" opacity="0.85" />
    </g>

    <!-- ─── TRIO OF BLUSH ROSES ─── -->

    <!-- Left Rose Blossom -->
    <g id="flower-left" transform="translate(168, 30)">
      <path d="M 0 -13 C 8 -13, 13 -8, 13 0 C 13 8, 8 13, 0 13 C -8 13, -13 8, -13 0 C -13 -8, -8 -13, 0 -13 Z" fill="url(#roseSide)" />
      <path d="M -9 -7 C -4 -13, 6 -13, 10 -6 C 13 2, 7 11, -1 11 C -8 11, -13 3, -9 -7 Z" fill="url(#petalShadow)" opacity="0.6" />
      <path d="M -6 5 C -2 10, 7 8, 8 2 C 9 -4, 2 -8, -4 -6 C -9 -3, -9 2, -6 5 Z" fill="url(#roseSide)" />
      <circle cx="0" cy="0" r="5" fill="#B85D75" opacity="0.75" />
      <circle cx="-1" cy="-1" r="3.2" fill="#FCE4EC" />
      <circle cx="0" cy="0" r="1.5" fill="#F3E5AB" />
    </g>

    <!-- Right Rose Blossom -->
    <g id="flower-right" transform="translate(232, 30)">
      <path d="M 0 -13 C 8 -13, 13 -8, 13 0 C 13 8, 8 13, 0 13 C -8 13, -13 8, -13 0 C -13 -8, -8 -13, 0 -13 Z" fill="url(#roseSide)" />
      <path d="M 9 -7 C 4 -13, -6 -13, -10 -6 C -13 2, -7 11, 1 11 C 8 11, 13 3, 9 -7 Z" fill="url(#petalShadow)" opacity="0.6" />
      <path d="M 6 5 C 2 10, -7 8, -8 2 C -9 -4, -2 -8, 4 -6 C 9 -3, 9 2, 6 5 Z" fill="url(#roseSide)" />
      <circle cx="0" cy="0" r="5" fill="#B85D75" opacity="0.75" />
      <circle cx="1" cy="-1" r="3.2" fill="#FCE4EC" />
      <circle cx="0" cy="0" r="1.5" fill="#F3E5AB" />
    </g>

    <!-- Center Main Rose Blossom -->
    <g id="flower-center" transform="translate(200, 30)">
      <ellipse cx="0" cy="2" rx="17" ry="16" fill="rgba(184, 93, 117, 0.18)" />
      <path d="M 0 -16 C 10 -16, 17 -10, 17 0 C 17 10, 10 16, 0 16 C -10 16, -17 10, -17 0 C -17 -10, -10 -16, 0 -16 Z" fill="url(#roseCenter)" />
      <path d="M -12 -9 C -6 -17, 8 -16, 13 -8 C 17 2, 10 13, 0 14 C -9 14, -16 5, -12 -9 Z" fill="url(#petalShadow)" opacity="0.7" />
      <path d="M -8 7 C -2 13, 9 11, 11 3 C 13 -5, 4 -11, -4 -9 C -11 -6, -12 2, -8 7 Z" fill="url(#roseCenter)" />
      <path d="M 8 -7 C 4 -12, -7 -10, -9 -3 C -11 5, -3 9, 4 8 C 10 7, 11 -1, 8 -7 Z" fill="url(#petalShadow)" opacity="0.7" />
      <circle cx="0" cy="0" r="7.5" fill="#B85D75" opacity="0.85" />
      <circle cx="-1" cy="-1" r="5" fill="#FCE4EC" />
      <path d="M -2 -1 C 0 -3, 3 -2, 2 1 C 1 3, -1 3, -2 1 Z" fill="#C26A82" />
      <circle cx="0" cy="0" r="2.2" fill="url(#goldLeaf)" />
      <circle cx="-0.5" cy="-0.5" r="0.8" fill="#FFF8DC" />
    </g>
  </g>
</svg>
