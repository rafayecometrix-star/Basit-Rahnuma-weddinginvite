<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <!-- Soft semi-transparent blush wash fill -->
  <path d="M 90 40 
           C 140 25, 200 35, 250 25 
           C 300 35, 360 25, 410 40 
           C 445 55, 475 90, 475 140 
           C 485 160, 485 180, 475 200 
           C 475 240, 440 275, 400 290 
           C 350 305, 300 295, 250 305 
           C 200 295, 150 305, 100 290 
           C 60 275, 25 240, 25 200 
           C 15 180, 15 160, 25 140 
           C 25 90, 55 55, 90 40 Z" 
        fill="rgba(255, 252, 253, 0.92)" />

  <!-- Outer ornamental border in Royal Gold -->
  <path d="M 90 40 
           C 140 25, 200 35, 250 25 
           C 300 35, 360 25, 410 40 
           C 445 55, 475 90, 475 140 
           C 485 160, 485 180, 475 200 
           C 475 240, 440 275, 400 290 
           C 350 305, 300 295, 250 305 
           C 200 295, 150 305, 100 290 
