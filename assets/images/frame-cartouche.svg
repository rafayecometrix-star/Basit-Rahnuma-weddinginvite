           C 15 180, 15 160, 25 140 
           C 25 90, 55 55, 90 40 Z" 
        stroke="#C59B3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner delicate decorative border with scrolls in soft rose -->
  <path d="M 105 55 
           C 150 45, 195 52, 250 45 
           C 305 52, 350 45, 395 55 
           C 425 70, 455 100, 455 145 
           C 462 160, 462 175, 455 190 
           C 455 225, 420 255, 385 270 
           C 345 282, 305 275, 250 282 
           C 195 275, 155 282, 115 270 
           C 80 255, 45 225, 45 190 
           C 38 175, 38 160, 45 145 
           C 45 100, 75 70, 105 55 Z" 
        stroke="#D47A94" stroke-width="1.6" stroke-dasharray="6,3" />

  <!-- Victorian Corner Flourishes -->
  <!-- Top Center Shell -->
  <path d="M 235 25 Q 250 15 265 25 Q 250 32 235 25" fill="#C59B3F" opacity="0.75" />
  <circle cx="250" cy="18" r="3" fill="#C59B3F" />
  
  <!-- Bottom Center Shell -->
  <path d="M 235 305 Q 250 315 265 305 Q 250 298 235 305" fill="#C59B3F" opacity="0.75" />
  <circle cx="250" cy="312" r="3" fill="#C59B3F" />

  <!-- Left / Right Filigree curls in Rose -->
  <path d="M 20 150 C 10 160, 10 180, 20 190 C 25 180, 25 160, 20 150" stroke="#D47A94" stroke-width="2" />
  <path d="M 480 150 C 490 160, 490 180, 480 190 C 475 180, 475 160, 480 150" stroke="#D47A94" stroke-width="2" />
</svg>
