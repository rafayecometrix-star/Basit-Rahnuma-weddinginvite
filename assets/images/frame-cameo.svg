<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" fill="none">
  <!-- Outer Delft Blue Scalloped Border -->
  <path d="M 180 15
           C 260 15, 335 80, 335 220
           C 335 360, 260 425, 180 425
           C 100 425, 25 360, 25 220
           C 25 80, 100 15, 180 15 Z"
        stroke="#4A7A9F" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Outer Scallop Ripples -->
  <ellipse cx="180" cy="220" rx="162" ry="212" stroke="rgba(74, 122, 159, 0.4)" stroke-width="1.5" stroke-dasharray="8,6" />

  <!-- Inner Gold Beaded Rim -->
  <ellipse cx="180" cy="220" rx="142" ry="188" stroke="#C4954A" stroke-width="2.5" />
  <ellipse cx="180" cy="220" rx="136" ry="182" stroke="rgba(196, 149, 74, 0.6)" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Top Ribbon Bow in Delft Blue -->
  <g transform="translate(180, 30)">
    <!-- Bow Loops -->
    <path d="M 0 0 C -25 -15, -45 -10, -40 10 C -35 25, -15 15, 0 5 Z" fill="#4A7A9F" opacity="0.85" />
    <path d="M 0 0 C 25 -15, 45 -10, 40 10 C 35 25, 15 15, 0 5 Z" fill="#4A7A9F" opacity="0.85" />
    <!-- Center Knot -->
    <circle cx="0" cy="2" r="6" fill="#2E5574" />
    <!-- Ribbon Tails -->
    <path d="M -4 6 Q -15 25 -25 35 Q -18 30 -10 24 Q -4 14 -2 8" fill="#4A7A9F" opacity="0.8" />
    <path d="M 4 6 Q 15 25 25 35 Q 18 30 10 24 Q 4 14 2 8" fill="#4A7A9F" opacity="0.8" />
  </g>

  <!-- Bottom Floral Ornament in Delft Blue & Gold -->
  <g transform="translate(180, 410)">
    <circle cx="0" cy="0" r="5" fill="#C4954A" />
    <path d="M -15 -8 Q 0 -18 15 -8 Q 0 -3 -15 -8 Z" fill="#4A7A9F" opacity="0.75" />
    <circle cx="-18" cy="-8" r="3" fill="#C4954A" />
    <circle cx="18" cy="-8" r="3" fill="#C4954A" />
  </g>
</svg>
