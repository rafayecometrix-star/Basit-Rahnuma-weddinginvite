<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <linearGradient id="goldFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C87A"/>
      <stop offset="30%" stop-color="#D4A853"/>
      <stop offset="60%" stop-color="#F5E6C8"/>
      <stop offset="85%" stop-color="#C59B40"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5C3D5E" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Ornate Baroque Border -->
  <g filter="url(#goldGlow)" fill="none" stroke="url(#goldFrameGrad)">
    <!-- Main Outer Oval -->
    <ellipse cx="200" cy="260" rx="175" ry="230" stroke-width="6"/>
    <ellipse cx="200" cy="260" rx="163" ry="218" stroke-width="2" stroke-dasharray="4,3"/>
    <ellipse cx="200" cy="260" rx="155" ry="210" stroke-width="4"/>
    
    <!-- Top Crown / Crest -->
    <path d="M160 38 Q200 8 240 38 Q220 52 200 42 Q180 52 160 38 Z" fill="url(#goldFrameGrad)" stroke-width="2"/>
    <circle cx="200" cy="18" r="7" fill="url(#goldFrameGrad)"/>
    <circle cx="180" cy="28" r="4" fill="url(#goldFrameGrad)"/>
    <circle cx="220" cy="28" r="4" fill="url(#goldFrameGrad)"/>
    
    <!-- Bottom Flourish -->
    <path d="M160 482 Q200 512 240 482 Q220 468 200 478 Q180 468 160 482 Z" fill="url(#goldFrameGrad)" stroke-width="2"/>
    <circle cx="200" cy="502" r="7" fill="url(#goldFrameGrad)"/>
    <circle cx="180" cy="492" r="4" fill="url(#goldFrameGrad)"/>
    <circle cx="220" cy="492" r="4" fill="url(#goldFrameGrad)"/>
    
    <!-- Left & Right Filigree Nodes -->
    <path d="M22 260 C22 235 38 230 42 260 C38 290 22 285 22 260 Z" fill="url(#goldFrameGrad)"/>
    <circle cx="32" cy="260" r="5" fill="#FFF"/>
    
    <path d="M378 260 C378 235 362 230 358 260 C362 290 378 285 378 260 Z" fill="url(#goldFrameGrad)"/>
    <circle cx="368" cy="260" r="5" fill="#FFF"/>
    
    <!-- Beaded Inner Border -->
    <ellipse cx="200" cy="260" rx="146" ry="198" stroke-width="1.5" stroke-dasharray="2,5"/>
  </g>
</svg>
