<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" fill="none">
  <!-- Soft Eucalyptus and Olive Leaves Spray -->
  <g opacity="0.85">
    <!-- Main stem arch -->
    <path d="M 50 110 Q 180 50 350 40" stroke="#7A8E68" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 80 100 Q 200 70 330 65" stroke="#8EA27A" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Left leaves -->
    <path d="M 65 95 C 50 85 45 70 60 75 C 75 80 75 90 65 95 Z" fill="#8AA378" opacity="0.7" />
    <path d="M 95 85 C 80 75 75 60 90 65 C 105 70 105 80 95 85 Z" fill="#A2BA8E" opacity="0.75" />
    <path d="M 125 75 C 110 65 110 50 125 55 C 140 60 135 72 125 75 Z" fill="#758E62" opacity="0.7" />

    <!-- Center Soft Hydrangea Bloom -->
    <g transform="translate(180, 60)">
      <circle cx="0" cy="0" r="22" fill="rgba(235, 244, 248, 0.9)" />
      <circle cx="-10" cy="-6" r="10" fill="#E2EDF5" stroke="#B8D0E5" stroke-width="0.75" />
      <circle cx="10" cy="-6" r="10" fill="#EAF2F8" stroke="#B8D0E5" stroke-width="0.75" />
      <circle cx="0" cy="8" r="11" fill="#F0F6FA" stroke="#C4D8EA" stroke-width="0.75" />
      <circle cx="-6" cy="4" r="8" fill="#FFFFFF" stroke="#ADC8E0" stroke-width="0.75" />
      <circle cx="7" cy="3" r="8" fill="#FFFFFF" stroke="#ADC8E0" stroke-width="0.75" />
      <circle cx="0" cy="-2" r="3" fill="#D4AF37" opacity="0.6" />
    </g>

    <!-- White Garden Rose -->
    <g transform="translate(240, 52)">
      <circle cx="0" cy="0" r="18" fill="rgba(255, 253, 250, 0.95)" stroke="#D8DEC8" stroke-width="1" />
      <path d="M -8 -4 C -12 6, 12 10, 8 -6 C 4 -12, -6 -10, -8 -4 Z" fill="#FAF6EE" stroke="#C8CCA8" stroke-width="0.75" />
      <circle cx="0" cy="0" r="5" fill="#F2ECE0" />
    </g>

    <!-- Baby's breath little white dots -->
    <circle cx="140" cy="45" r="3" fill="#FFFFFF" stroke="#B0C8A0" stroke-width="0.8" />
    <circle cx="150" cy="38" r="2.5" fill="#FFFFFF" stroke="#B0C8A0" stroke-width="0.8" />
    <circle cx="210" cy="35" r="3" fill="#FFFFFF" stroke="#B0C8A0" stroke-width="0.8" />
    <circle cx="280" cy="45" r="2.5" fill="#FFFFFF" stroke="#B0C8A0" stroke-width="0.8" />
    <circle cx="295" cy="40" r="3" fill="#FFFFFF" stroke="#B0C8A0" stroke-width="0.8" />
    <circle cx="310" cy="48" r="2" fill="#FFFFFF" stroke="#B0C8A0" stroke-width="0.8" />

    <!-- Right leaves -->
    <path d="M 285 55 C 300 45 315 48 310 60 C 300 70 290 65 285 55 Z" fill="#8AA378" opacity="0.7" />
    <path d="M 320 50 C 340 40 355 45 350 58 C 340 65 325 60 320 50 Z" fill="#A2BA8E" opacity="0.7" />
  </g>
</svg>
